<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#37474F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#546E7A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow7">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg7)"/>

  <!-- Decorative circles -->
  <circle cx="950" cy="200" r="260" fill="#B0BEC5" fill-opacity="0.06"/>
  <circle cx="1050" cy="100" r="150" fill="#B0BEC5" fill-opacity="0.08"/>
  <circle cx="900" cy="350" r="100" fill="#B0BEC5" fill-opacity="0.05"/>

  <!-- Diagonal accent bar -->
  <rect x="750" y="-20" width="8" height="450" fill="#B0BEC5" fill-opacity="0.25" transform="rotate(-15 750 200)"/>
  <rect x="800" y="-20" width="3" height="450" fill="#B0BEC5" fill-opacity="0.15" transform="rotate(-15 800 200)"/>

  <!-- PriceSmart logo area -->
  <rect x="60" y="40" width="180" height="36" rx="4" fill="#B0BEC5" fill-opacity="0.18"/>
  <text x="75" y="64" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#B0BEC5" letter-spacing="1">PriceSmart</text>

  <!-- Icon -->
  <text x="68" y="230" font-size="72" opacity="0.95">📋</text>

  <!-- Title -->
  <text x="68" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="white" filter="url(#glow7)">Terms &</text>
  <text x="68" y="340" font-family="Georgia, serif" font-size="64" font-weight="700" fill="white">Conditions</text>

  <!-- Subtitle -->
  <text x="68" y="380" font-family="Arial, sans-serif" font-size="22" fill="#B0BEC5" fill-opacity="0.9" letter-spacing="1">Transparency You Can Trust</text>

  <!-- Bottom accent line -->
  <rect x="68" y="388" width="120" height="4" rx="2" fill="#B0BEC5"/>
</svg>